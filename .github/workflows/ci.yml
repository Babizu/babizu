# 框架的持續整合：單元測試、建置示範站台、端對端測試。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 單元測試
        run: npm test

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 建置示範站台並跑端對端測試
        run: npm run test:e2e
